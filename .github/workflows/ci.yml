name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  module-ci:
    uses: tinyhumansai/.github/.github/workflows/module-ci.yml@5ad0e00d8af6e89fc516015ccb13ab114b947be6
    with:
      coverage-script: scripts/check-coverage.sh
      module-e2e-script: scripts/test-e2e.sh
      feature-test-script: scripts/test-features.sh
